<g font-family="IBM Plex Mono, monospace" font-size="7" letter-spacing="1.2" fill="#8B8680"><text x="14" y="661">ÉTER — SHOWROOM VACÍO</text><text x="14" y="669" fill="#9E2B1E">— LUZ NATURAL · ORDEN QUIRÚRGICO</text></g>
